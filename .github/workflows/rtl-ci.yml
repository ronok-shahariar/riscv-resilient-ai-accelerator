name: RISC-V RTL and Firmware CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: PicoRV32 Firmware and RTL Verification

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with caching
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: riscv-ai-accelerator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PicoRV32 verification suite in Docker
        run: |
          docker run --rm -v $(pwd):/workspace riscv-ai-accelerator ./scripts/run_tests.sh

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picorv32-simulation-logs
          path: simulation/build/*.log
          if-no-files-found: warn
          retention-days: 14