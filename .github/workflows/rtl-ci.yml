name: RISC-V RTL and Firmware CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: PicoRV32 Firmware and RTL Verification

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache APT package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/rtl-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-cache-

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iverilog \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf \
            python3

      - name: Display tool versions
        run: |
          iverilog -V | head -n 3
          riscv64-unknown-elf-gcc --version | head -n 1
          python3 --version

      - name: Run PicoRV32 verification suite
        env:
          CROSS_PREFIX: riscv64-unknown-elf-
        run: |
          bash scripts/run_tests.sh

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picorv32-simulation-logs
          path: simulation/build/*.log
          if-no-files-found: warn
          retention-days: 14